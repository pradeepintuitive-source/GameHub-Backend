version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gamehub
      POSTGRES_USER: gamehub
      POSTGRES_PASSWORD: gamehub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    depends_on:
      - postgres
    environment:
      GAMEHUB_DB_URL: jdbc:postgresql://postgres:5432/gamehub
      GAMEHUB_DB_USERNAME: gamehub
      GAMEHUB_DB_PASSWORD: gamehub
      GAMEHUB_JWT_SECRET: change-me-change-me-change-me-change-me
    ports:
      - "8080:8080"

volumes:
  pgdata:
